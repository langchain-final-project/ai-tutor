# API 실행, DB 연결, 기본 테스트에 쓰는 직접 의존성 버전을 정의합니다.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "didgo-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "psycopg[binary]==3.3.3",
    "SQLAlchemy==2.0.48",
    "uvicorn==0.34.3",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==8.4.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
