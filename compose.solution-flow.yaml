# .env.example을 .env로 복사한 뒤 compose.yaml과 함께 실행한다.
# docker compose -f compose.yaml -f compose.solution-flow.yaml up --build --wait
services:
  solution-flow-init:
    build: ./backend
    command:
      - python
      - -B
      - scripts/setup_solution_flow.py
      - --database
      - /var/lib/didgo-solution/solution-flow.sqlite3
      - --create-empty
      - --with-auth
    volumes:
      - solution_data:/var/lib/didgo-solution
    restart: "no"

  api:
    command:
      - uvicorn
      - app.student_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    environment:
      DIDGO_DATABASE: /var/lib/didgo-solution/solution-flow.sqlite3
      DIDGO_TYPE_BANK_DATABASE: /opt/didgo/problem_bank.seed.sqlite3
      DIDGO_CONCEPT_BANK_DIR: /opt/didgo/concept_bank
      DIDGO_QWEN_URL: ${DIDGO_QWEN_URL:-http://host.docker.internal:8081/v1}
      DIDGO_QWEN_MODEL: ${DIDGO_QWEN_MODEL:-}
      DIDGO_TUTOR_URL: ${DIDGO_TUTOR_URL:-http://host.docker.internal:11434}
      DIDGO_TUTOR_MODEL: ${DIDGO_TUTOR_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      DIDGO_TUTOR_PROVIDER: ${DIDGO_TUTOR_PROVIDER:-ollama}
      DIDGO_TUTOR_PROFILE: ${DIDGO_TUTOR_PROFILE:-standard}
      DIDGO_TUTOR_API_KEY: ${DIDGO_TUTOR_API_KEY:-}
      DIDGO_TUTOR_TIMEOUT: ${DIDGO_TUTOR_TIMEOUT:-90}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - solution_data:/var/lib/didgo-solution
      # 팀 문제은행과 개념 카드는 학생 DB와 분리해 읽기 전용으로 사용한다.
      - type: bind
        source: ./data/problem_bank/problem_bank.seed.sqlite3
        target: /opt/didgo/problem_bank.seed.sqlite3
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/concept_bank
        target: /opt/didgo/concept_bank
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      solution-flow-init:
        condition: service_completed_successfully

volumes:
  solution_data:
